<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-labelledby="t d">
  <title id="t">About David, as a terminal session</title>
  <desc id="d">whoami: David Stepanyan, full-stack developer at COAF, Armenia. Stack: backend Node.js, Express, REST APIs, Socket.io; frontend React, Vite, Next.js, Three.js, GSAP; data MongoDB, PostgreSQL, MySQL, SQLite; infra Linux, Nginx, PM2, Prometheus, Grafana. Motto: building things that matter, one commit at a time.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; }
      .title { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .p { fill: #3fb950; font-weight: 700; }
      .c { fill: #e6edf3; }
      .o { fill: #9da7b3; }
      .k { fill: #61dafb; }
      .m { fill: #d2a8ff; }
      .l { opacity: 0; animation: show 0.01s linear forwards; }
      .cv { transform-box: fill-box; transform-origin: 100% 50%; animation-name: type; animation-fill-mode: both; animation-timing-function: steps(10); }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes type { from { transform: scaleX(1); } to { transform: scaleX(0); } }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .l { animation: none; opacity: 1; }
        .cv { display: none; }
        .cur { animation: none; }
      }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="390" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1 15 A14 14 0 0 1 15 1 H885 A14 14 0 0 1 899 15 V42 H1 Z" fill="#161b22"/>
  <line x1="1" y1="42" x2="899" y2="42" stroke="#30363d"/>
  <circle cx="26" cy="22" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6.5" fill="#28c840"/>
  <text x="450" y="26.5" text-anchor="middle" class="title">david@armenia: ~</text>

  <!-- 1. whoami -->
  <g class="l" style="animation-delay:.3s">
    <text x="28" y="80"><tspan class="p">~ $</tspan><tspan class="c" dx="10">whoami</tspan></text>
    <rect class="cv" x="63" y="64" width="64" height="22" fill="#0d1117" style="animation-delay:.4s; animation-duration:.6s; animation-timing-function: steps(6)"/>
  </g>
  <g class="l" style="animation-delay:1.2s">
    <text x="28" y="108"><tspan class="o">David Stepanyan, full-stack developer at </tspan><tspan class="m">COAF</tspan><tspan class="o"> (Armenia)</tspan></text>
  </g>

  <!-- 2. stack -->
  <g class="l" style="animation-delay:1.9s">
    <text x="28" y="150"><tspan class="p">~ $</tspan><tspan class="c" dx="10">cat stack.txt</tspan></text>
    <rect class="cv" x="63" y="134" width="130" height="22" fill="#0d1117" style="animation-delay:2s; animation-duration:1.1s; animation-timing-function: steps(13)"/>
  </g>
  <g class="l" style="animation-delay:3.3s"><text x="28" y="178"><tspan class="k">backend </tspan><tspan class="o" x="128">Node.js, Express, REST APIs, Socket.io</tspan></text></g>
  <g class="l" style="animation-delay:3.5s"><text x="28" y="204"><tspan class="k">frontend</tspan><tspan class="o" x="128">React, Vite, Next.js, Three.js, GSAP</tspan></text></g>
  <g class="l" style="animation-delay:3.7s"><text x="28" y="230"><tspan class="k">data    </tspan><tspan class="o" x="128">MongoDB, PostgreSQL, MySQL, SQLite</tspan></text></g>
  <g class="l" style="animation-delay:3.9s"><text x="28" y="256"><tspan class="k">infra   </tspan><tspan class="o" x="128">Linux, Nginx, PM2, Prometheus, Grafana</tspan></text></g>

  <!-- 3. motto -->
  <g class="l" style="animation-delay:4.6s">
    <text x="28" y="298"><tspan class="p">~ $</tspan><tspan class="c" dx="10">echo $MOTTO</tspan></text>
    <rect class="cv" x="63" y="282" width="112" height="22" fill="#0d1117" style="animation-delay:4.7s; animation-duration:1s; animation-timing-function: steps(11)"/>
  </g>
  <g class="l" style="animation-delay:6s">
    <text x="28" y="326" class="c">Building things that matter, one commit at a time.</text>
  </g>

  <!-- 4. prompt -->
  <g class="l" style="animation-delay:6.6s">
    <text x="28" y="364" class="p">~ $</text>
    <rect class="cur" x="66" y="350" width="10" height="19" fill="#e6edf3"/>
  </g>
</svg>
